name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
      # 単体テストでは検出できない「注入されない」「描画されない」を実ブラウザで確かめる
      - run: node tests/e2e/overlay.e2e.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: inkover-chrome
          path: .output/*.zip
