<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>inkover — スクロール追従と PNG 保存</title>
    <link rel="stylesheet" href="./store.css" />
    <style>
      /* shot-4: スクロールしても貼り付く／描画込みで保存できる、の 2 点。 */
      .wrap {
        height: 100%;
        padding: 0 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .head h1 { font-size: 38px; margin: 18px 0 0; line-height: 1.34; }
      .head .hl { color: var(--pen-coral); }

      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-top: 40px;
      }
      .col .cap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .col .cap .t { font-size: 17px; font-weight: 800; }
      .col .cap .k {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
      }
      .col .d { font-size: 15px; color: var(--text-muted); margin: 0 0 16px; line-height: 1.65; }

      /* 左: スクロール追従を 2 コマで示す */
      .pair { display: flex; gap: 14px; align-items: center; }
      .mini {
        position: relative;
        width: 244px;
        height: 268px;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-md);
      }
      .mini .rows { padding: 16px 14px; }
      .mini .row { height: 9px; border-radius: 4px; background: #e7ebf3; margin-bottom: 9px; }
      .mini .row.w1 { width: 72%; }
      .mini .row.w2 { width: 92%; }
      .mini .card2 {
        margin-top: 10px; height: 74px; border-radius: 9px;
        background: linear-gradient(135deg, #eef1f8, #e4e9f4);
        border: 1px solid #dfe4ee;
      }
      .mini svg { position: absolute; inset: 0; }
      .mini .tag {
        position: absolute; top: 8px; right: 10px;
        font-size: 10px; font-weight: 700;
        color: var(--text-muted);
        background: rgba(15,20,32,.72);
        border: 1px solid var(--border);
        border-radius: 6px; padding: 2px 7px;
      }
      .arrow { color: var(--pen-coral); display: grid; place-items: center; }
      .arrow svg { width: 30px; height: 30px; }

      /* 右: 保存されるファイルのイメージ */
      .file {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-lg);
      }
      .file .bar2 {
        height: 30px; background: #10151f;
        display: flex; align-items: center; gap: 8px; padding: 0 12px;
        border-bottom: 1px solid var(--border);
        font-size: 11px; color: var(--text-muted);
      }
      .file .dot { width: 9px; height: 9px; border-radius: 50%; }
      .file .body { position: relative; height: 236px; }
      .file .rows { padding: 16px 16px; }
      .file .row { height: 10px; border-radius: 4px; background: #e7ebf3; margin-bottom: 10px; }
      .file .row.w1 { width: 68%; }
      .file .row.w2 { width: 90%; }
      .file .card2 {
        margin-top: 12px; height: 96px; border-radius: 10px;
        background: linear-gradient(135deg, #eef1f8, #e4e9f4);
        border: 1px solid #dfe4ee;
      }
      .file svg { position: absolute; inset: 0; }
      .file .note {
        position: absolute; left: 52px; top: 142px;
        font-family: var(--font-round);
        font-size: 20px; color: var(--pen-coral);
        -webkit-text-stroke: 3px rgba(0,0,0,.5);
        paint-order: stroke fill;
      }
      .filename {
        margin-top: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: var(--text-muted);
        display: flex; align-items: center; gap: 8px;
      }
      .filename svg { width: 15px; height: 15px; color: var(--pen-emerald); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="wrap">
        <div class="head">
          <span class="eyebrow">Stays put · Saves out</span>
          <h1>スクロールしても<span class="hl">ついてくる</span>。<br />そのまま画像で<span class="hl">残せる</span>。</h1>
        </div>

        <div class="cols">
          <div class="col">
            <div class="cap"><span class="t">スクロール追従</span></div>
            <p class="d">長いページでも、描いた印はその場所に貼り付いたままです。</p>
            <div class="pair">
              <div class="mini">
                <div class="tag">上のほう</div>
                <div class="rows">
                  <div class="row w2"></div>
                  <div class="row w1"></div>
                  <div class="card2"></div>
                  <div class="row w2" style="margin-top:14px"></div>
                  <div class="row w1"></div>
                </div>
                <svg viewBox="0 0 244 268">
                  <ellipse cx="128" cy="112" rx="80" ry="34" fill="none" stroke="#fb7185" stroke-width="4" />
                </svg>
              </div>

              <div class="arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14" /><path d="M6 13l6 6 6-6" />
                </svg>
              </div>

              <div class="mini">
                <div class="tag">スクロール後</div>
                <div class="rows">
                  <div class="row w1"></div>
                  <div class="card2" style="margin-top:0"></div>
                  <div class="row w2" style="margin-top:14px"></div>
                  <div class="row w1"></div>
                  <div class="row w2"></div>
                </div>
                <svg viewBox="0 0 244 268">
                  <!-- 同じ要素に貼り付いたまま上へ移動している -->
                  <ellipse cx="128" cy="58" rx="80" ry="34" fill="none" stroke="#fb7185" stroke-width="4" />
                </svg>
              </div>
            </div>
          </div>

          <div class="col">
            <div class="cap"><span class="t">PNG 保存</span><span class="k">Cmd / Ctrl + S</span></div>
            <p class="d">議事録に貼れる形で、描き込みごと書き出せます。</p>
            <div class="file">
              <div class="bar2">
                <span class="dot" style="background:#f87171"></span>
                <span class="dot" style="background:#fbbf24"></span>
                <span class="dot" style="background:#34d399"></span>
                <span style="margin-left:6px">保存された画像</span>
              </div>
              <div class="body">
                <div class="rows">
                  <div class="row w2"></div>
                  <div class="row w1"></div>
                  <div class="card2"></div>
                </div>
                <svg viewBox="0 0 560 236">
                  <rect x="176" y="118" width="220" height="76" fill="none" stroke="#fbbf24" stroke-width="4" rx="3" />
                  <line x1="92" y1="176" x2="160" y2="150" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
                  <polygon points="176,144 146,142 156,166" fill="#fbbf24" />
                  <circle cx="440" cy="86" r="17" fill="#fb7185" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
                  <text x="440" y="93" text-anchor="middle" fill="#fff" font-family="Mochiy Pop One, sans-serif" font-size="19">1</text>
                </svg>
                <div class="note">ここ</div>
              </div>
            </div>
            <div class="filename">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
              inkover-20260811-140233.png
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
