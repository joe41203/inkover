<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>inkover — 画面共有で相手に映る</title>
    <link rel="stylesheet" href="./store.css" />
    <style>
      /* shot-3: 画面共有との関係。自分の画面と相手の画面を並べて「同じものが映る」を示す。 */
      .wrap {
        height: 100%;
        padding: 0 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .head h1 { font-size: 40px; margin: 18px 0 0; }
      .head .hl { color: var(--pen-coral); }
      .head .sub { font-size: 19px; margin: 16px 0 0; max-width: 66ch; }

      .pair {
        display: grid;
        grid-template-columns: 1fr 132px 1fr;
        align-items: center;
        margin-top: 40px;
      }
      .side .cap {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 13px;
        color: var(--text-muted);
      }
      .side .cap .who { color: var(--text); }
      .screen {
        position: relative;
        height: 250px;
        border-radius: var(--radius-xl);
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-lg);
      }
      .screen .rows { padding: 20px 18px; }
      .screen .row { height: 10px; border-radius: 4px; background: #e7ebf3; margin-bottom: 10px; }
      .screen .row.w1 { width: 70%; }
      .screen .row.w2 { width: 90%; }
      .screen .card2 {
        margin-top: 14px; height: 104px; border-radius: 10px;
        background: linear-gradient(135deg, #eef1f8, #e4e9f4);
        border: 1px solid #dfe4ee;
      }
      .screen svg { position: absolute; inset: 0; }
      .screen .note {
        position: absolute;
        left: 52px; top: 158px;
        font-family: var(--font-round);
        font-size: 22px;
        color: var(--pen-coral);
        -webkit-text-stroke: 3px rgba(0, 0, 0, 0.5);
        paint-order: stroke fill;
      }
      /* 相手側は会議アプリのフレームを被せる */
      .screen.remote::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 3px solid rgba(251, 113, 133, 0.55);
        border-radius: var(--radius-xl);
        pointer-events: none;
      }

      .arrow-mid {
        display: grid;
        place-items: center;
        color: var(--pen-coral);
      }
      .arrow-mid svg { width: 46px; height: 46px; }
      .arrow-mid .lbl {
        font-size: 12px;
        font-weight: 800;
        color: var(--text-muted);
        margin-top: 8px;
        white-space: nowrap;
      }

      .foot {
        margin-top: 34px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .foot .pill { font-size: 16px; padding: 9px 16px; }
      .foot .pill svg { color: var(--pen-coral); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="wrap">
        <div class="head">
          <span class="eyebrow">Screen sharing</span>
          <h1>描いたものは、<span class="hl">ちゃんと相手にも映る</span>。</h1>
          <p class="sub">
            画面共有はブラウザが描いた結果をそのまま送るので、拡張が描いた線もページの一部として届きます。相手側に何かを入れてもらう必要はありません。
          </p>
        </div>

        <div class="pair">
          <div class="side">
            <div class="cap"><span class="sharing"><span class="rec"></span>共有中</span><span class="who">自分の画面</span></div>
            <div class="screen">
              <div class="rows">
                <div class="row w2"></div>
                <div class="row w1"></div>
                <div class="card2"></div>
              </div>
              <svg viewBox="0 0 490 250">
                <ellipse cx="300" cy="176" rx="128" ry="46" fill="none" stroke="#fb7185" stroke-width="5" />
                <line x1="80" y1="96" x2="196" y2="146" stroke="#fb7185" stroke-width="5" stroke-linecap="round" />
                <polygon points="214,155 178,146 190,126" fill="#fb7185" />
              </svg>
              <div class="note">ここ</div>
            </div>
          </div>

          <div class="arrow-mid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h13" /><path d="M13 6l6 6-6 6" />
            </svg>
            <div class="lbl">そのまま届く</div>
          </div>

          <div class="side">
            <div class="cap"><span class="who">相手が見ている画面</span></div>
            <div class="screen remote">
              <div class="rows">
                <div class="row w2"></div>
                <div class="row w1"></div>
                <div class="card2"></div>
              </div>
              <svg viewBox="0 0 490 250">
                <ellipse cx="300" cy="176" rx="128" ry="46" fill="none" stroke="#fb7185" stroke-width="5" />
                <line x1="80" y1="96" x2="196" y2="146" stroke="#fb7185" stroke-width="5" stroke-linecap="round" />
                <polygon points="214,155 178,146 190,126" fill="#fb7185" />
              </svg>
              <div class="note">ここ</div>
            </div>
          </div>
        </div>

        <div class="foot">
          <span class="pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2" /><path d="M8 21h8" /><path d="M12 18v3" /></svg>
            タブ共有・ウィンドウ共有・画面全体共有のすべてで映ります
          </span>
          <span class="pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4" /><path d="M12 18v4" /><circle cx="12" cy="12" r="4" /></svg>
            相手のインストールは不要
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
