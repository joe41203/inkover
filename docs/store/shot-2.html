<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>inkover — 消えるインク</title>
    <link rel="stylesheet" href="./store.css" />
    <style>
      /* shot-2: 消えるインク。描いた線が時間で薄くなる様子を 3 コマで見せる。 */
      .wrap {
        height: 100%;
        padding: 0 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .head { max-width: 940px; }
      .head h1 { font-size: 40px; margin: 18px 0 0; }
      .head .hl { color: var(--pen-coral); }
      .head .sub { font-size: 20px; margin: 18px 0 0; max-width: 60ch; }

      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 26px;
        margin-top: 54px;
      }
      .step .cap {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .step .t {
        font-size: 15px;
        font-weight: 800;
        color: var(--pen-coral);
        font-variant-numeric: tabular-nums;
      }
      .step .d { font-size: 15px; color: var(--text-muted); font-weight: 600; }

      /* 各コマ: 明るいページの上に注釈が乗っている図 */
      .frame {
        position: relative;
        height: 330px;
        border-radius: var(--radius-xl);
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-lg);
      }
      .frame .rows { padding: 22px 20px; }
      .frame .row {
        height: 11px;
        border-radius: 4px;
        background: #e7ebf3;
        margin-bottom: 11px;
      }
      .frame .row.w1 { width: 74%; }
      .frame .row.w2 { width: 92%; }
      .frame .row.w3 { width: 60%; }
      .frame .card {
        margin-top: 16px;
        height: 96px;
        border-radius: 10px;
        background: linear-gradient(135deg, #eef1f8, #e4e9f4);
        border: 1px solid #dfe4ee;
      }
      .frame svg { position: absolute; inset: 0; }
      .frame .note {
        position: absolute;
        font-family: var(--font-round);
        font-size: 22px;
        color: var(--pen-coral);
        -webkit-text-stroke: 3px rgba(0, 0, 0, 0.5);
        paint-order: stroke fill;
        left: 44px;
        top: 128px;
      }

      /* 下部の補足。空きを埋めつつ挙動を言葉でも説明する。 */
      .foot {
        margin-top: 34px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .foot .pill { font-size: 16px; padding: 10px 17px; }
      .foot .pill svg { color: var(--pen-coral); }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="wrap">
        <div class="head">
          <span class="eyebrow">Vanishing ink</span>
          <h1>描いた線は、<span class="hl">数秒で消える</span>。</h1>
          <p class="sub">
            話しながら描いて、そのまま次の話題へ。消しゴムを持ち替える必要も、消し忘れて画面が汚れることもありません。
          </p>
        </div>

        <div class="steps">
          <div class="step">
            <div class="cap"><span class="t">0秒</span><span class="d">描く</span></div>
            <div class="frame">
              <div class="rows">
                <div class="row w2"></div>
                <div class="row w1"></div>
                <div class="row w3"></div>
                <div class="card"></div>
              </div>
              <svg viewBox="0 0 340 330">
                <ellipse cx="196" cy="212" rx="108" ry="46" fill="none" stroke="#fb7185" stroke-width="5" />
                <line x1="72" y1="152" x2="152" y2="188" stroke="#fb7185" stroke-width="5" stroke-linecap="round" />
                <polygon points="168,196 136,186 148,168" fill="#fb7185" />
              </svg>
              <div class="note">ここ</div>
            </div>
          </div>

          <div class="step">
            <div class="cap"><span class="t">6秒</span><span class="d">薄くなりはじめる</span></div>
            <div class="frame">
              <div class="rows">
                <div class="row w2"></div>
                <div class="row w1"></div>
                <div class="row w3"></div>
                <div class="card"></div>
              </div>
              <svg viewBox="0 0 340 268" style="opacity: 0.45">
                <ellipse cx="196" cy="212" rx="108" ry="46" fill="none" stroke="#fb7185" stroke-width="5" />
                <line x1="72" y1="152" x2="152" y2="188" stroke="#fb7185" stroke-width="5" stroke-linecap="round" />
                <polygon points="168,196 136,186 148,168" fill="#fb7185" />
              </svg>
              <div class="note" style="opacity: 0.42">ここ</div>
            </div>
          </div>

          <div class="step">
            <div class="cap"><span class="t">7秒</span><span class="d">消える</span></div>
            <div class="frame">
              <div class="rows">
                <div class="row w2"></div>
                <div class="row w1"></div>
                <div class="row w3"></div>
                <div class="card"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="foot">
          <span class="pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
            消えるまでの時間は切り替えられます
          </span>
          <span class="pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M6 7l1 12h10l1-12" /><path d="M9 7V4h6v3" /></svg>
            残したいときは消えるインクを切って、全消去で一度に消す
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
